name: Daily Instagram Reel
on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-and-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run generate:reels
      - name: Publish generated media for Buffer
        run: |
          git config user.name "theballdept-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/reels output/reels-manifest.json
          git diff --cached --quiet || git commit -m "Generate daily reels"
          git push
      - name: Queue today's Reel in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: npm run publish
